name: Build

# Builds the debranded DMG. Runs on pushes and PRs (DMG in the run's artifacts), and
# from fork/sync-upstream.sh. Run on a version tag (vX.Y) it also publishes a release
# with a signed Sparkle appcast.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read fork config
        run: |
          source fork/config.sh
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY_NAME=$SIGN_IDENTITY_NAME" >> "$GITHUB_ENV"

      # Liquid Glass needs the macOS 26 SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install DMG builder
        run: brew install create-dmg

      # A fixed self-signed certificate, so macOS keeps the app's permissions across
      # updates (ad-hoc signatures change with every build).
      - name: Import signing certificate
        env:
          P12: ${{ secrets.FORK_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.FORK_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No signing certificate; building ad-hoc."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/fork.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/fork.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/fork.p12"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY_NAME" >> "$GITHUB_ENV"

      - name: Build universal DMG
        env:
          ARCHS: arm64 x86_64
          BUILD: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./build.sh dmg
          codesign -dvv "build/$APP_NAME.app" 2>&1 | grep -E "Authority|Signature|Identifier"
          shasum -a 256 "build/$APP_NAME.dmg" > "build/$APP_NAME.dmg.sha256"

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME"

      - name: Sign update and generate appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --embed-release-notes \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            build

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}
          path: |
            build/${{ env.APP_NAME }}.dmg
            build/${{ env.APP_NAME }}.dmg.sha256
            build/appcast.xml
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/${{ env.APP_NAME }}.dmg
            build/${{ env.APP_NAME }}.dmg.sha256
            build/appcast.xml
          body_path: build/release-notes.md
